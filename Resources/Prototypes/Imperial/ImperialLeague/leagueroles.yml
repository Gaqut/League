# Tracker

- type: playTimeTracker
  id: LeagueRedParticipant

- type: playTimeTracker
  id: LeagueBlueParticipant

- type: playTimeTracker
  id: LeagueYellowParticipant

- type: playTimeTracker
  id: LeagueVioletParticipant

# Roles

- type: job
  id: LeagueRedParticipant
  name: role-name-red-participant
  description: role-description-red-participant
  playTimeTracker: LeagueRedParticipant
  requirements:
    - !type:DepartmentTimeRequirement
      department: RedTeam
      time: 1000000 #League improvised team whitelist timer
  startingGear: LeagueRed
  icon: "roleIconRed"
  supervisors: role-supervisors-league
  canBeAntag: false
  access:
  - External
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
#  - !type:NpcFactionMember
#    factions:
#    - LeagueRed

