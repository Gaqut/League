# Spawn

- type: entity
  id: SpawnPointLeagueRed
  parent: SpawnPointJobBase
  name: Red Participant
  components:
  - type: SpawnPoint
    job_id: LeagueRedParticipant
  - type: Sprite
    netsync: false
    sprite: Imperial/ImperialLeague/Marks/spawn.rsi
    state: spawnred

