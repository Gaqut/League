# Team departments

- type: department
  id: RedTeam
  name: team-Red
  description: team-red-description
  color: "#ff0000"
  roles:
  - LeagueRedParticipant
  primary: false

- type: department
  id: BlueTeam
  name: team-Blue
  description: team-blue-description
  color: "#1e00ff"
